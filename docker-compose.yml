version: '3.8'

services:
  web:
    container_name: qapril-web
    image: qapril-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NODE_ENV=production
    restart: unless-stopped
