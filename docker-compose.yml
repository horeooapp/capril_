# ══════════════════════════════════════════════════════════════════
# QAPRIL — docker-compose.yml
# Services: app (Next.js), postgres, redis
# ══════════════════════════════════════════════════════════════════

# Nom de projet explicite : évite que Docker génère "capril_-app"
# depuis le nom du dossier (capril_ → nom d'image invalide)
name: qapril

services:

  # ── PostgreSQL 15 ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: qapril_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Stone2026}
      POSTGRES_DB: ${POSTGRES_DB:-qapril}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports: non exposé — accès via réseau Docker interne uniquement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-qapril}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qapril_net

  # ── Redis 7 ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: qapril_redis
    restart: unless-stopped
    # Sans mot de passe en dév (REDIS_PASSWORD vide = pas d'auth)
    # En prod: définir REDIS_PASSWORD dans .env.docker
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD";
        else
          redis-server;
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    # ports: non exposé — accès via réseau Docker interne uniquement
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qapril_net

  # ── Migrate : run Prisma migrations avant de démarrer l'app ───
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: qapril_migrate
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Stone2026}@postgres:5432/${POSTGRES_DB:-qapril}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qapril_net

  # ── Next.js App ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qapril_app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Surcharge les URL de service pour pointer vers les containers
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Stone2026}@postgres:5432/${POSTGRES_DB:-qapril}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      ENABLE_REDIS_MOCK: "false"
      OPENWA_API_URL: http://openwa:8085
      OPENWA_API_KEY: ${OPENWA_API_KEY:-qapril_wa_secret_2026}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - qapril_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── OpenWA (WhatsApp Automate) ─────────────────────────────────
  openwa:
    build:
      context: .
      dockerfile: Dockerfile.openwa
    image: qapril_openwa:latest
    container_name: qapril_openwa
    restart: unless-stopped
    shm_size: '2gb'
    environment:
      PORT: "8085"
      AUTH_KEY: "qapril_wa_secret_2026"
      WA_API_KEY: "qapril_wa_secret_2026"
    volumes:
      - openwa_data:/app/session
    ports:
      - "127.0.0.1:8085:8085"
    networks:
      - qapril_net

volumes:
  postgres_data:
  redis_data:
  openwa_data:

networks:
  qapril_net:
    driver: bridge
