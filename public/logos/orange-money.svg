<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <rect width="200" height="80" rx="16" fill="#000000"/>
  <!-- Orange Square -->
  <g transform="translate(18, 14)">
    <rect width="52" height="52" rx="10" fill="#FF7900"/>
    <text x="26" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.3">orange</text>
  </g>
  <!-- "orange" text + "money" text -->
  <g transform="translate(80, 28)">
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FF7900" letter-spacing="0.5">orange</text>
    <text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="1">MONEY</text>
  </g>
</svg>
