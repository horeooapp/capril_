<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <rect width="200" height="80" rx="16" fill="#1BA8DE"/>
  <!-- Penguin Icon -->
  <g transform="translate(22, 14)">
    <!-- Penguin Body Background -->
    <ellipse cx="26" cy="30" rx="18" ry="22" fill="#101820"/>
    <!-- White Belly -->
    <ellipse cx="26" cy="33" rx="12" ry="16" fill="#FFFFFF"/>
    <!-- Left Wing -->
    <path d="M 9 24 C 5 28 6 36 10 40 C 11 36 11 30 11 26 Z" fill="#101820"/>
    <!-- Right Wing (waving) -->
    <path d="M 43 24 C 49 19 54 22 51 30 C 47 31 43 28 42 25 Z" fill="#101820"/>
    <!-- Left Eye -->
    <circle cx="21" cy="20" r="3" fill="#FFFFFF"/>
    <circle cx="22" cy="20" r="1.5" fill="#101820"/>
    <!-- Right Eye -->
    <circle cx="31" cy="20" r="3" fill="#FFFFFF"/>
    <circle cx="30" cy="20" r="1.5" fill="#101820"/>
    <!-- Beak -->
    <polygon points="26,22 21,27 31,27" fill="#FF8200"/>
    <!-- Bow Tie -->
    <polygon points="21,30 26,33 21,36" fill="#00D2FF"/>
    <polygon points="31,30 26,33 31,36" fill="#00D2FF"/>
    <circle cx="26" cy="33" r="2" fill="#FFFFFF"/>
    <!-- Feet -->
    <ellipse cx="19" cy="51" rx="5" ry="2.5" fill="#FF8200"/>
    <ellipse cx="33" cy="51" rx="5" ry="2.5" fill="#FF8200"/>
  </g>
  <!-- Wordmark "wave" -->
  <text x="88" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">wave</text>
</svg>
