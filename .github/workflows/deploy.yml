# Trigger: 2026-03-30 02:35 UTC (Fix Server Incident + Robust Layout + BDQ Fallback Safety)
# Trigger deploy with nuclear exorcism and Prisma fixes
name: 🚀 Deploy QAPRIL v3.0 to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────
  # JOB 1: Quality Gate (Build + Type Check)
  # ──────────────────────────────────────────────────────
  build:
    name: 🔨 Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v6

      - name: ☢️ Nuclear Runner Cleanup (Purge Stale Modules)
        run: |
          echo "☢️ Nuking stale runner workspace to ensure zero contamination..."
          rm -rf node_modules .next dist out dist_package package-lock.json || true

      - name: 🛡️ Prisma Guard (Pre-check Schema)
        run: |
          echo "🔍 Verifying Schema Content BEFORE Build..."
          grep "provider = \"postgresql\"" prisma/schema.prisma || (echo "❌ ERROR: Schema is NOT postgresql!" && exit 1)

      - name: 📦 Install dependencies (Fresh Slate)
        run: |
          npm install

      - name: 🧪 Client Guard (Verify Generated Client)
        run: |
          echo "🔍 Checking Generated Client..."
          grep -q 'provider = "postgresql"' node_modules/.prisma/client/schema.prisma || (echo "❌ ERROR: SQLite contamination in client!" && exit 1)
          echo "✅ Client is 100% PostgreSQL-native."

      - name: 🔍 TypeScript type check
        run: npx tsc --noEmit

      - name: 🏗️ Build App (PostgreSQL Native)
        run: |
          # Robustly extract DATABASE_URL from secret
          RAW_URL='${{ secrets.DATABASE_URL }}'
          CLEAN_DB_URL=$(echo "$RAW_URL" | sed -n 's/.*DATABASE_URL=\(.*\)/\1/p')
          [ -z "$CLEAN_DB_URL" ] && CLEAN_DB_URL="$RAW_URL"
          CLEAN_DB_URL=$(echo "$CLEAN_DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
          
          if [[ ! "$CLEAN_DB_URL" =~ ^postgres(ql)?:// ]]; then
            echo "❌ ERROR: DATABASE_URL must start with postgresql://. Detected protocol: ${CLEAN_DB_URL%%://*}"
            exit 1
          fi
          
          export DATABASE_URL="$CLEAN_DB_URL"
          npm run build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
          MOBILE_MONEY_WEBHOOK_SECRET: ${{ secrets.MOBILE_MONEY_WEBHOOK_SECRET }}
          ORANGE_MONEY_API_KEY: ${{ secrets.ORANGE_MONEY_API_KEY }}
          MTN_MOMO_API_KEY: ${{ secrets.MTN_MOMO_API_KEY }}
          MOOV_MONEY_API_KEY: ${{ secrets.MOOV_MONEY_API_KEY }}
          MAPOSTE_WEBHOOK_SECRET: ${{ secrets.MAPOSTE_WEBHOOK_SECRET }}
          MAPOSTE_API_KEY: ${{ secrets.MAPOSTE_API_KEY }}
          SMS_GATEWAY_PROVIDER: ${{ vars.SMS_GATEWAY_PROVIDER }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          USSD_SHARED_SECRET: ${{ secrets.USSD_SHARED_SECRET }}

      - name: 📦 Create Deployment Package
        run: |
          mkdir -p dist_package
          
          # 1. Standalone bundle (Server logic + its own production node_modules)
          # Use '.' to include hidden files like .next/
          cp -a .next/standalone/. dist_package/
          
          # 2. Static assets (Must be separate in Next.js Standalone)
          mkdir -p dist_package/.next/static
          cp -a .next/static/. dist_package/.next/static/
          
          # 3. Public assets (Images, etc. - excluding local uploads if any)
          mkdir -p dist_package/public
          cp -a public/. dist_package/public/
          
          # 4. Prisma & Scripts (Migrations & Diagnostics)
          mkdir -p dist_package/prisma
          cp -a prisma/schema.prisma dist_package/prisma/
          cp -a scripts dist_package/

          # 🔥 COMPILE SEED (To avoid ts-node on VPS)
          # We run tsc from inside the prisma dir to avoid nested output folders
          echo "🌱 Compiling Prisma Seed..."
          npx tsc prisma/seed.ts --esModuleInterop --module commonjs --target es2020 --outDir dist_package/prisma
          
          # Fix tsc nesting if it happened
          if [ -d "dist_package/prisma/prisma" ]; then
             mv dist_package/prisma/prisma/* dist_package/prisma/
             rm -rf dist_package/prisma/prisma
          fi

          echo "🔍 Verifying Deployment Package Structure:"
          ls -R dist_package/prisma
          # Standalone generates its own server.js, we rename it to next-server.js
          if [ -f "dist_package/server.js" ]; then
            mv dist_package/server.js dist_package/next-server.js
          fi

          # 6. Global server.js (Our custom loader)
          cp -a server.js dist_package/

      - name: 🔱 Post-Build Exorcism (Nuclear Search & Destroy SQLite)
        run: |
          echo "🔱 Purging ALL 'sqlite' provider variants from ALL build artifacts..."
          # Nuclear Regex: Catches 'provider = "sqlite"', 'provider: "sqlite"', '"provider": "sqlite"', etc.
          EXORCISM_REGEX='s/([\"'\'']?provider[\"'\'']?[[:space:]]*[:=][[:space:]]*[\"'\''])sqlite([\"'\''])/\1postgresql\2/gI'
          
          # Remove file extension filters to ensure we hit .rsc, .meta, and other Next.js internal files
          find dist_package -type f -print0 | xargs -0 sed -i -E "$EXORCISM_REGEX"
          
          echo "🧪 Verifying Nuclear Exorcism Results..."
          # Check for ANY case-insensitive variation of sqlite provider in the final artifacts
          # We output the matched lines for easier debugging if it fails
          SURVIVORS=$(grep -rEi 'provider[[:space:]]*[:=][[:space:]]*["'\'']sqlite["'\'']' dist_package/ || true)
          if [ -n "$SURVIVORS" ]; then
            echo "❌ ERROR: SQLite ghosts survived the exorcism in these files:"
            echo "$SURVIVORS"
            exit 1
          fi
          echo "✅ Package fully purged of SQLite artifacts."

      - name: 💾 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          include-hidden-files: true
          path: dist_package/
          retention-days: 1

  # ──────────────────────────────────────────────────────
  # JOB 2: Deploy to Hostinger
  # ──────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Hostinger
    runs-on: self-hosted
    needs: build
    environment: production

    steps:
      - name: 🧹 Safe Runner Cleanup
        run: |
          # The artifact v4 telemetry bug on self-hosted runners requires aggressive clearing of diagnostic pages
          [ -d "/home/github/actions-runner/_diag/pages" ] && sudo rm -f /home/github/actions-runner/_diag/pages/* || true
          rm -rf .next public prisma scripts dist_package package.json package-lock.json || true

      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: 🟢 Setup Node.js (Runner Env)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 🚀 Transfer Files to VPS
        run: |
          DEPLOY_DEST="${{ vars.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_DEST" ]; then DEPLOY_DEST="/home/github/capril_app"; fi
          sudo mkdir -p $DEPLOY_DEST
          
          # 停止 APP 
          sudo su - github -c "pm2 stop capril || true"
          sudo su - github -c "pm2 delete capril || true"

          echo "🧹 Nuking STALE artifacts on VPS (Pre-deployment)..."
          # Only keep persistent directories and critical config
          sudo rm -rf $DEPLOY_DEST/.next $DEPLOY_DEST/node_modules $DEPLOY_DEST/package.json $DEPLOY_DEST/package-lock.json || true
          
          # Sync everything from dist_package (which was downloaded to current dir)
          echo "🚀 Syncing 100% FRESH standalone build..."
          rsync -rlptvz --delete --no-owner --no-group --no-perms \
            --exclude=".env*" \
            --exclude="public/uploads/" \
            ./ $DEPLOY_DEST/

          # Force restore ownership to github user
          sudo chown -R github:github $DEPLOY_DEST || true

          # 🧪 FINAL INTEGRITY CHECK & ON-SITE EXORCISM
          echo "🧪 Final Pre-Restart Integrity Check & Sanitization..."
          
          # Force fix any survivors on the VPS filesystem using the Nuclear Regex (ALL files)
          EXORCISM_REGEX='s/([\"'\'']?provider[\"'\'']?[[:space:]]*[:=][[:space:]]*[\"'\''])sqlite([\"'\''])/\1postgresql\2/gI'
          find $DEPLOY_DEST -type f -print0 | xargs -0 sudo sed -i -E "$EXORCISM_REGEX" || true

          if [ ! -d "$DEPLOY_DEST/.next/server" ]; then
            echo "🚨 FATAL ERROR: Server directory missing! Deployment incomplete."
            exit 1
          fi
          
          # Case-insensitive verification with verbose output
          OFFENDING_FILES=$(grep -rEi 'provider[[:space:]]*[:=][[:space:]]*["'\'']sqlite["'\'']' $DEPLOY_DEST/.next/server/ || true)
          if [ -n "$OFFENDING_FILES" ]; then
            echo "🚨 FATAL ERROR: SQLite ghost detected in these final deployment files:"
            echo "$OFFENDING_FILES"
            exit 1
          fi
          echo "✅ Integrity verified (PostgreSQL-native)."

      # Handled inside the restart block for better permission consistency

      - name: 🔐 Create Production .env
        run: |
          DEPLOY_DEST="${{ vars.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_DEST" ]; then DEPLOY_DEST="/home/github/capril_app"; fi
          cd $DEPLOY_DEST
          
          # Robustly extract DATABASE_URL from secret
          RAW_URL='${{ secrets.DATABASE_URL }}'
          CLEAN_DB_URL=$(echo "$RAW_URL" | sed -n 's/.*DATABASE_URL=\(.*\)/\1/p')
          [ -z "$CLEAN_DB_URL" ] && CLEAN_DB_URL="$RAW_URL"
          CLEAN_DB_URL=$(echo "$CLEAN_DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
          
          if [[ ! "$CLEAN_DB_URL" =~ ^postgres(ql)?:// ]]; then
            echo "❌ ERROR: Invalid DATABASE_URL protocol on production host."
            exit 1
          fi
          
          echo "DATABASE_URL=$CLEAN_DB_URL" > .env
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
          echo "NEXTAUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
          echo "AUTH_URL=${{ secrets.AUTH_URL }}" >> .env
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> .env
          echo "NEXTAUTH_URL_INTERNAL=http://127.0.0.1:3000" >> .env
          echo "AUTH_TRUST_HOST=true" >> .env
          echo "AUTH_RESEND_KEY=${{ secrets.AUTH_RESEND_KEY }}" >> .env
          echo "EMAIL_FROM=${{ vars.EMAIL_FROM }}" >> .env
          echo "EMAIL_SERVER=${{ secrets.EMAIL_SERVER }}" >> .env
          echo "JWT_PRIVATE_KEY=${{ secrets.JWT_PRIVATE_KEY }}" >> .env
          echo "JWT_PUBLIC_KEY=${{ secrets.JWT_PUBLIC_KEY }}" >> .env
          echo "MOBILE_MONEY_WEBHOOK_SECRET=${{ secrets.MOBILE_MONEY_WEBHOOK_SECRET }}" >> .env
          echo "ORANGE_MONEY_API_KEY=${{ secrets.ORANGE_MONEY_API_KEY }}" >> .env
          echo "MTN_MOMO_API_KEY=${{ secrets.MTN_MOMO_API_KEY }}" >> .env
          echo "MOOV_MONEY_API_KEY=${{ secrets.MOOV_MONEY_API_KEY }}" >> .env
          echo "WAVE_API_KEY=${{ secrets.WAVE_API_KEY }}" >> .env
          echo "MAPOSTE_WEBHOOK_SECRET=${{ secrets.MAPOSTE_WEBHOOK_SECRET }}" >> .env
          echo "MAPOSTE_API_KEY=${{ secrets.MAPOSTE_API_KEY }}" >> .env
          echo "SMS_GATEWAY_PROVIDER=${{ vars.SMS_GATEWAY_PROVIDER }}" >> .env
          echo "SMS_API_KEY=${{ secrets.SMS_API_KEY }}" >> .env
          echo "SMS_SENDER_NAME=${{ vars.SMS_SENDER_NAME }}" >> .env
          echo "USSD_SHARED_SECRET=${{ secrets.USSD_SHARED_SECRET }}" >> .env
          echo "NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}" >> .env
          echo "OTP_TTL_SECONDS=${{ vars.OTP_TTL_SECONDS || 600 }}" >> .env
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env
          echo "ENABLE_REDIS_MOCK=false" >> .env
          echo "NODE_ENV=production" >> .env

      - name: 📦 Install and Start Local Redis
        run: |
          sudo apt-get update || true
          sudo apt-get install -y redis-server
          sudo systemctl enable redis-server || true
          sudo systemctl start redis-server || true

      - name: 🚀 Start Application (PM2)
        run: |
          DEPLOY_DEST="${{ vars.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_DEST" ]; then DEPLOY_DEST="/home/github/capril_app"; fi
          
          # Fix permissions for execution
          sudo chown -R $USER:$USER ~/.pm2 || true

          # 1. Robust Extraction
          RAW_URL="${{ secrets.DATABASE_URL }}"
          # Use grep to isolate the URL from any surrounding text/quotes
          CLEAN_DB_URL=$(echo "$RAW_URL" | grep -oE "postgresql?://[^[:space:]'\" ]+" | head -n1)
          
          # 2. Validation
          case "$CLEAN_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "❌ CRITICAL: Invalid DATABASE_URL protocol. Received: ${CLEAN_DB_URL:0:10}..."; exit 1 ;;
          esac

          # 3. Execution (Standard Block)
          sudo -u github CLEAN_DB_URL="$CLEAN_DB_URL" DEPLOY_DEST="$DEPLOY_DEST" bash << 'EOF_DEPLOY'
            set -e
            export DATABASE_URL="$CLEAN_DB_URL"
            cd "$DEPLOY_DEST"
            
            echo "🛡️ Synchronizing Database Credentials..."
            # Extraire et décoder le mot de passe de manière ultra-robuste
            ENCODED_PASS=$(echo "$CLEAN_DB_URL" | sed -e 's|^.*://[^:]*:\([^@]*\)@.*$|\1|')
            DECODED_PASS=$(node -e "console.log(decodeURIComponent(process.argv[1]))" "$ENCODED_PASS")
            # Echapper les apostrophes pour SQL
            ESCAPED_PASS=$(echo "$DECODED_PASS" | sed "s/'/''/g")
            
            # Appliquer le mot de passe DIRECTEMENT au démarrage pour garantir l'alignement
            sudo -u postgres psql -c "ALTER USER qapril_user WITH PASSWORD '$ESCAPED_PASS';" || echo "⚠️ Failed to reset password."

            echo "🧪 Testing connectivity..."
            if ! node scripts/test-db-connection.js; then
              echo "❌ Final Connection Attempt Failed! Dumping logs..."
              sudo systemctl status postgresql --no-pager || true
              exit 1
            fi
            echo "✅ Connectivity Verified!"
            
            echo "🔧 Fixing PostgreSQL permissions for qapril_user..."
            sudo -u postgres psql -c "ALTER USER qapril_user WITH SUPERUSER;" || true
            sudo -u postgres psql -d qapril -c "GRANT ALL ON SCHEMA public TO qapril_user;" || true
            sudo -u postgres psql -d qapril -c "ALTER SCHEMA public OWNER TO qapril_user;" || true
            
            # Massive ownership transfer via a single-line SQL command to avoid Heredoc indentation issues
            sudo -u postgres psql -d qapril -c "DO \$\$ DECLARE r RECORD; BEGIN FOR r IN (SELECT typname FROM pg_type JOIN pg_namespace n ON n.oid = typnamespace WHERE n.nspname = 'public' AND typtype = 'e') LOOP EXECUTE 'ALTER TYPE public.' || quote_ident(r.typname) || ' OWNER TO qapril_user'; END LOOP; FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP EXECUTE 'ALTER TABLE public.' || quote_ident(r.tablename) || ' OWNER TO qapril_user'; END LOOP; FOR r IN (SELECT relname FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'S') LOOP EXECUTE 'ALTER SEQUENCE public.' || quote_ident(r.relname) || ' OWNER TO qapril_user'; END LOOP; END \$\$;"

            # Verify the provider in the logs for the main schema
            echo "--- Server-side schema.prisma snippet ---"
            grep -C 2 "provider =" prisma/schema.prisma || echo "Schema not found in ./prisma/"

            echo "📦 Running Prisma Migrations..."
            npx prisma@6.4.1 db push --accept-data-loss
            
            # 🔥 RESTART PM2 & SEED
            echo "🌱 Running Compiled Seed Logic..."
            if [ -f "prisma/seed.js" ]; then
               echo "🚀 EXEC: node prisma/seed.js"
               if sudo su - github -c "cd $DEPLOY_DEST && npm config set strict-ssl false && npm install bcrypt-ts --no-save --omit=dev && export DATABASE_URL='${{ secrets.DATABASE_URL }}' && node prisma/seed.js"; then
                  echo "✅ SEED SUCCESSFUL"
               else
                  echo "❌ SEED FAILED (Non-fatal, continuing...)"
               fi
            else
              echo "⚠️ Compiled seed NOT found at $DEPLOY_DEST/prisma/seed.js. Skipping seeding."
            fi
            
            echo "📁 Setting up persistent storage..."
            rm -rf public/uploads || true
            mkdir -p /home/github/capril_data/uploads
            [ -L "public/uploads" ] || ln -s /home/github/capril_data/uploads public/uploads || true
            
            echo "🚀 Starting application (PM2)..."
            pm2 describe capril > /dev/null 2>&1 && pm2 delete capril || echo 'PM2: New process'
            
            # Use the ROOT server.js (loader) instead of internal Next.js server.js
            # This ensures .env is loaded and we bind to 127.0.0.1
            PORT=3000 HOSTNAME=127.0.0.1 pm2 start server.js --name capril --cwd "$DEPLOY_DEST" --env production --update-env
            pm2 save
          EOF_DEPLOY

      - name: 🩺 Health Check
        run: |
          DEPLOY_DEST="/home/github/capril_app"
          echo "🩺 Checking application health at http://127.0.0.1:3000/api/health"
          
          # Tentative de Health Check
          MAX_RETRIES=5
          COUNT=0
          while [ $COUNT -lt $MAX_RETRIES ]; do
            if curl -s -f http://127.0.0.1:3000/api/health | grep -iq "ok"; then
              echo "✅ Application is healthy!"
              exit 0
            fi
            echo "⏳ Waiting for application to boot... ($((COUNT+1))/$MAX_RETRIES)"
            sleep 5
            COUNT=$((COUNT+1))
          done
          
          echo "❌ Health check failed. Dumping diagnostics..."
          sudo -u github bash << 'EOF_DIAG'
            echo "--- PM2 Status ---"
            pm2 list
            echo "--- PM2 Logs (Last 50 lines) ---"
            pm2 logs capril --lines 50 --no-daemon & sleep 5 && kill $!
            
            echo "--- System DB Status ---"
            sudo systemctl status postgresql --no-pager || echo "PostgreSQL service not found."
            
            echo "--- Listening Ports ---"
            sudo ss -tulpn | grep 5432 || echo "No process listening on 5432"
          EOF_DIAG
          exit 1

      - name: 📣 Notify on Success
        if: success()
        run: |
          echo "🎉 QAPRIL v3.0 deployed successfully to production"
          echo "URL: ${{ vars.NEXT_PUBLIC_APP_URL }}"

      - name: 🔴 Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check logs above."
