# Trigger: 2026-03-30 02:35 UTC (Fix Server Incident + Robust Layout + BDQ Fallback Safety)
name: 🚀 Deploy QAPRIL v3.0 to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────
  # JOB 1: Quality Gate (Build + Type Check)
  # ──────────────────────────────────────────────────────
  build:
    name: 🔨 Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 TypeScript type check
        run: npx tsc --noEmit

      - name: 🔨 Build application
        run: |
          # Robustly extract DATABASE_URL from secret (handles multiline or accidental labels)
          RAW_URL='${{ secrets.DATABASE_URL }}'
          CLEAN_DB_URL=$(echo "$RAW_URL" | sed -n 's/.*DATABASE_URL=\(.*\)/\1/p')
          [ -z "$CLEAN_DB_URL" ] && CLEAN_DB_URL="$RAW_URL"
          
          # Trim whitespace and quotes
          CLEAN_DB_URL=$(echo "$CLEAN_DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
          
          # 🚨 CRITICAL PROTOCOL VALIDATION
          if [[ ! "$CLEAN_DB_URL" =~ ^postgres(ql)?:// ]]; then
            echo "❌ ERROR: DATABASE_URL must start with postgresql:// or postgres://"
            echo "Detected protocol: ${CLEAN_DB_URL%%://*}"
            if [[ "$CLEAN_DB_URL" =~ ^file: ]]; then
              echo "⚠️  SQLite detected (file:) which is NOT supported in production."
            fi
            exit 1
          fi
          
          export DATABASE_URL="$CLEAN_DB_URL"
          npm run build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
          # Mobile Money & Payments
          MOBILE_MONEY_WEBHOOK_SECRET: ${{ secrets.MOBILE_MONEY_WEBHOOK_SECRET }}
          ORANGE_MONEY_API_KEY: ${{ secrets.ORANGE_MONEY_API_KEY }}
          MTN_MOMO_API_KEY: ${{ secrets.MTN_MOMO_API_KEY }}
          MOOV_MONEY_API_KEY: ${{ secrets.MOOV_MONEY_API_KEY }}
          # MaPoste
          MAPOSTE_WEBHOOK_SECRET: ${{ secrets.MAPOSTE_WEBHOOK_SECRET }}
          MAPOSTE_API_KEY: ${{ secrets.MAPOSTE_API_KEY }}
          # SMS Gateway
          SMS_GATEWAY_PROVIDER: ${{ vars.SMS_GATEWAY_PROVIDER }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          # USSD
          USSD_SHARED_SECRET: ${{ secrets.USSD_SHARED_SECRET }}
          # App
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

      - name: 📦 Create Deployment Package
        run: |
          mkdir -p dist_package
          # Next.js Standalone mode essentials
          mkdir -p dist_package/.next
          cp -r .next/standalone dist_package/.next/
          cp -r .next/static dist_package/.next/
          cp -r public dist_package/
          cp -r prisma dist_package/
          cp -r scripts dist_package/
          cp server.js dist_package/
          # No need for root node_modules or package.json as they are in standalone

      - name: 💾 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          include-hidden-files: true
          path: dist_package/
          retention-days: 1

  # ──────────────────────────────────────────────────────
  # JOB 2: Deploy to Hostinger
  # ──────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Hostinger
    runs-on: self-hosted
    needs: build
    environment: production

    steps:
      - name: 🧹 Safe Runner Cleanup
        run: |
          # The artifact v4 telemetry bug on self-hosted runners requires aggressive clearing of diagnostic pages
          # Delete file contents rather than the directory to avoid runner lock conflicts
          # Use sudo only if the file exists to avoid unnecessary permission noise
          [ -d "/home/github/actions-runner/_diag/pages" ] && sudo rm -f /home/github/actions-runner/_diag/pages/* || true
          
          # Targeted cleanup of build artifacts only. 
          # We avoid 'find .' which can inadvertently target sensitive runner-internal directories (like _temp) 
          # if they are present in the search path or symlinked.
          rm -rf .next public prisma scripts dist_package package.json package-lock.json || true
          
          # Workspace Debugging (helps diagnose if the environment is corrupted)
          echo "--- Runner Environment Context ---"
          echo "PWD: $(pwd)"
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -F

      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: 🟢 Setup Node.js (Runner Env)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 🚀 Transfer Files to VPS
        run: |
          DEPLOY_DEST="${{ vars.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_DEST" ]; then DEPLOY_DEST="/home/github/capril_app"; fi
          sudo mkdir -p $DEPLOY_DEST
          sudo chown -R github:github $DEPLOY_DEST || sudo chown -R $USER:$USER $DEPLOY_DEST
          
          # 🛑 STOP APP BEFORE SYNC to release file locks and avoid "Directory not empty" errors
          sudo su - github -c "pm2 stop capril || true"
          
          # Sync production files. Using standalone reduces sync size by ~80%.
          # Part 1: Main synchronization (excluding static assets from deletion to prevent 'chunk failed' errors)
          rsync -rlptvz --delete --no-owner --no-group --no-perms \
            --exclude='.env*' \
            --exclude='*.db*' \
            --exclude='node_modules' \
            --exclude='.next/static' \
            ./ $DEPLOY_DEST/

          # Part 2: Accumulative sync of static assets (never delete old chunks to support active sessions)
          mkdir -p $DEPLOY_DEST/.next/static
          rsync -rlptvz --no-owner --no-group --no-perms \
            ./.next/static/ $DEPLOY_DEST/.next/static/

      # Handled inside the restart block for better permission consistency

      - name: 🔐 Create Production .env
        run: |
          DEPLOY_DEST="${{ vars.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_DEST" ]; then DEPLOY_DEST="/home/github/capril_app"; fi
          cd $DEPLOY_DEST
          
          # Robustly extract DATABASE_URL from secret
          RAW_URL='${{ secrets.DATABASE_URL }}'
          CLEAN_DB_URL=$(echo "$RAW_URL" | sed -n 's/.*DATABASE_URL=\(.*\)/\1/p')
          [ -z "$CLEAN_DB_URL" ] && CLEAN_DB_URL="$RAW_URL"
          CLEAN_DB_URL=$(echo "$CLEAN_DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
          
          if [[ ! "$CLEAN_DB_URL" =~ ^postgres(ql)?:// ]]; then
            echo "❌ ERROR: Invalid DATABASE_URL protocol on production host."
            exit 1
          fi
          
          echo "DATABASE_URL=$CLEAN_DB_URL" > .env
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
          echo "NEXTAUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
          echo "AUTH_URL=${{ secrets.AUTH_URL }}" >> .env
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> .env
          echo "NEXTAUTH_URL_INTERNAL=http://127.0.0.1:3000" >> .env
          echo "AUTH_TRUST_HOST=true" >> .env
          echo "AUTH_RESEND_KEY=${{ secrets.AUTH_RESEND_KEY }}" >> .env
          echo "EMAIL_FROM=${{ vars.EMAIL_FROM }}" >> .env
          echo "EMAIL_SERVER=${{ secrets.EMAIL_SERVER }}" >> .env
          echo "JWT_PRIVATE_KEY=${{ secrets.JWT_PRIVATE_KEY }}" >> .env
          echo "JWT_PUBLIC_KEY=${{ secrets.JWT_PUBLIC_KEY }}" >> .env
          echo "MOBILE_MONEY_WEBHOOK_SECRET=${{ secrets.MOBILE_MONEY_WEBHOOK_SECRET }}" >> .env
          echo "ORANGE_MONEY_API_KEY=${{ secrets.ORANGE_MONEY_API_KEY }}" >> .env
          echo "MTN_MOMO_API_KEY=${{ secrets.MTN_MOMO_API_KEY }}" >> .env
          echo "MOOV_MONEY_API_KEY=${{ secrets.MOOV_MONEY_API_KEY }}" >> .env
          echo "WAVE_API_KEY=${{ secrets.WAVE_API_KEY }}" >> .env
          echo "MAPOSTE_WEBHOOK_SECRET=${{ secrets.MAPOSTE_WEBHOOK_SECRET }}" >> .env
          echo "MAPOSTE_API_KEY=${{ secrets.MAPOSTE_API_KEY }}" >> .env
          echo "SMS_GATEWAY_PROVIDER=${{ vars.SMS_GATEWAY_PROVIDER }}" >> .env
          echo "SMS_API_KEY=${{ secrets.SMS_API_KEY }}" >> .env
          echo "SMS_SENDER_NAME=${{ vars.SMS_SENDER_NAME }}" >> .env
          echo "USSD_SHARED_SECRET=${{ secrets.USSD_SHARED_SECRET }}" >> .env
          echo "NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}" >> .env
          echo "OTP_TTL_SECONDS=${{ vars.OTP_TTL_SECONDS || 600 }}" >> .env
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env
          echo "ENABLE_REDIS_MOCK=false" >> .env
          echo "NODE_ENV=production" >> .env

      - name: 📦 Install and Start Local Redis
        run: |
          sudo apt-get update || true
          sudo apt-get install -y redis-server
          sudo systemctl enable redis-server || true
          sudo systemctl start redis-server || true

      - name: 🚀 Start Application (PM2)
        run: |
          DEPLOY_DEST="${{ vars.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_DEST" ]; then DEPLOY_DEST="/home/github/capril_app"; fi
          
          # Fix permissions for execution
          sudo chown -R $USER:$USER ~/.pm2 || true

          sudo su - github -c "
            set -e
            mkdir -p /home/github/capril_data/uploads
            cd $DEPLOY_DEST
            
            # Setup environment for database operations
            # Robustly extract DATABASE_URL from secret
            RAW_URL='${{ secrets.DATABASE_URL }}'
            CLEAN_DB_URL=$(echo "$RAW_URL" | sed -n 's/.*DATABASE_URL=\(.*\)/\1/p')
            [ -z "$CLEAN_DB_URL" ] && CLEAN_DB_URL="$RAW_URL"
            CLEAN_DB_URL=$(echo "$CLEAN_DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
            
            # Validation at start
            if [[ ! "$CLEAN_DB_URL" =~ ^postgres(ql)?:// ]]; then
                echo "❌ CRITICAL: Invalid DATABASE_URL detected on production server."
                exit 1
            fi
            
            export DATABASE_URL="\$CLEAN_DB_URL"
            
            # 🧪 TEST DB CONNECTION BEFORE MIGRATIONS
            echo "🧪 Starting standalone database connectivity test..."
            node scripts/test-db-connection.js || { echo "❌ DB Connectivity Test Failed!"; exit 1; }
            
            # Application of migrations
            npx prisma@6.4.1 db push --accept-data-loss
            npx prisma@6.4.1 db seed || true
            
            rm -rf public/uploads || true
            ln -s /home/github/capril_data/uploads public/uploads || true
            
            # Start via root server.js wrapper (which boots the internal standalone server)
            pm2 describe capril > /dev/null 2>&1 && pm2 delete capril || echo 'PM2: No existing process capril to delete'
            pm2 start server.js --name capril --cwd $DEPLOY_DEST --env production
            
            pm2 save
          "

      - name: 🩺 Health Check
        run: |
          echo "Waiting for app to start..."
          sleep 20
          
          # Check PM2 overall status
          echo "📊 PM2 Status:"
          sudo su - github -c "pm2 status capril"
          
          # Check if port 3000 is listening
          echo "🔌 Port 3000 check:"
          ss -lntu | grep :3000 || echo "⚠️ Port 3000 NOT listening!"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/api/health" || echo "000")
          echo "Health check status: $STATUS"
          
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed! (Expected 200, got $STATUS)"
            echo "📋 DUMPING PM2 LOGS:"
            sudo su - github -c "pm2 logs capril --lines 100 --nostream || true"
            echo "📋 DUMPING PM2 DESCRIPTION:"
            sudo su - github -c "pm2 describe capril || true"
            exit 1
          fi
          echo "✅ Application is healthy!"

      - name: 📣 Notify on Success
        if: success()
        run: |
          echo "🎉 QAPRIL v3.0 deployed successfully to production"
          echo "URL: ${{ vars.NEXT_PUBLIC_APP_URL }}"

      - name: 🔴 Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check logs above."
