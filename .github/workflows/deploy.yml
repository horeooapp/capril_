# Trigger deploy with Docker
name: 🚀 Deploy QAPRIL v3.0 to Hostinger (Docker)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Build & Deploy to Hostinger via Docker
    runs-on: self-hosted
    environment: production

    steps:
      - name: 🛡️ Repair & Clean Runner Workspace
        run: |
          echo "🛡️ Reclaiming ownership of the workspace..."
          sudo chown -R $USER:$USER /home/github/actions-runner/_work || true
          sudo chmod -R 755 /home/github/actions-runner/_work || true
          
          echo "🧹 Clearing diagnostic telemetry..."
          [ -d "/home/github/actions-runner/_diag/pages" ] && sudo rm -f /home/github/actions-runner/_diag/pages/* || true
          
          echo "☢️ Nuking stale artifacts..."
          sudo rm -rf node_modules .next public prisma scripts dist dist_package package.json package-lock.json || true

      - name: 🚚 Checkout repository
        uses: actions/checkout@v6

      - name: 🔐 Create Production .env
        run: |
          RAW_URL='${{ secrets.DATABASE_URL }}'
          CLEAN_DB_URL=$(echo "$RAW_URL" | sed -n 's/.*DATABASE_URL=\(.*\)/\1/p')
          [ -z "$CLEAN_DB_URL" ] && CLEAN_DB_URL="$RAW_URL"
          CLEAN_DB_URL=$(echo "$CLEAN_DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')
          
          echo "DATABASE_URL=$CLEAN_DB_URL" > .env
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
          echo "NEXTAUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env
          echo "AUTH_URL=${{ secrets.AUTH_URL }}" >> .env
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> .env
          echo "NEXTAUTH_URL_INTERNAL=http://127.0.0.1:3000" >> .env
          echo "AUTH_TRUST_HOST=true" >> .env
          echo "AUTH_RESEND_KEY=${{ secrets.AUTH_RESEND_KEY }}" >> .env
          echo "EMAIL_FROM=${{ vars.EMAIL_FROM }}" >> .env
          echo "EMAIL_SERVER=${{ secrets.EMAIL_SERVER }}" >> .env
          echo "JWT_PRIVATE_KEY=${{ secrets.JWT_PRIVATE_KEY }}" >> .env
          echo "JWT_PUBLIC_KEY=${{ secrets.JWT_PUBLIC_KEY }}" >> .env
          echo "MOBILE_MONEY_WEBHOOK_SECRET=${{ secrets.MOBILE_MONEY_WEBHOOK_SECRET }}" >> .env
          echo "ORANGE_MONEY_API_KEY=${{ secrets.ORANGE_MONEY_API_KEY }}" >> .env
          echo "MTN_MOMO_API_KEY=${{ secrets.MTN_MOMO_API_KEY }}" >> .env
          echo "MOOV_MONEY_API_KEY=${{ secrets.MOOV_MONEY_API_KEY }}" >> .env
          echo "WAVE_API_KEY=${{ secrets.WAVE_API_KEY }}" >> .env
          echo "MAPOSTE_WEBHOOK_SECRET=${{ secrets.MAPOSTE_WEBHOOK_SECRET }}" >> .env
          echo "MAPOSTE_API_KEY=${{ secrets.MAPOSTE_API_KEY }}" >> .env
          echo "SMS_GATEWAY_PROVIDER=${{ vars.SMS_GATEWAY_PROVIDER }}" >> .env
          echo "SMS_API_KEY=${{ secrets.SMS_API_KEY }}" >> .env
          echo "SMS_SENDER_NAME=${{ vars.SMS_SENDER_NAME }}" >> .env
          echo "ORANGE_SMS_CLIENT_ID=${{ secrets.ORANGE_SMS_CLIENT_ID }}" >> .env
          echo "ORANGE_SMS_CLIENT_SECRET=${{ secrets.ORANGE_SMS_CLIENT_SECRET }}" >> .env
          echo "ORANGE_SMS_SENDER_NUMBER=${{ vars.ORANGE_SMS_SENDER_NUMBER || 'tel:+22500000000' }}" >> .env
          echo "ORANGE_SMS_SENDER_NAME=${{ vars.ORANGE_SMS_SENDER_NAME || 'QAPRIL' }}" >> .env
          echo "USSD_SHARED_SECRET=${{ secrets.USSD_SHARED_SECRET }}" >> .env
          echo "NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}" >> .env
          echo "OTP_TTL_SECONDS=${{ vars.OTP_TTL_SECONDS || 600 }}" >> .env
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env
          echo "ENABLE_REDIS_MOCK=false" >> .env
          echo "NODE_ENV=production" >> .env

      - name: 🐳 Build and Start Docker Container
        run: |
          echo "🛑 Stopping existing PM2 instances if any..."
          pm2 stop capril || true
          pm2 delete capril || true
          pm2 save --force || true
          
          # Clean up the port just in case
          sudo fuser -k -9 3000/tcp || true
          sudo lsof -ti:3000 | xargs sudo kill -9 || true
          
          # Stop any old rogue Docker containers that might be holding port 3000
          echo "🧹 Cleaning up old containers..."
          sudo docker ps -q --filter "name=capril" | xargs -r sudo docker rm -f || true
          sudo docker ps -q --filter "name=web" | xargs -r sudo docker rm -f || true

          # Check if docker is installed, if not install it
          if ! command -v docker &> /dev/null; then
            echo "📦 Docker not found. Installing Docker..."
            curl -fsSL https://get.docker.com -o get-docker.sh
            sudo sh get-docker.sh
          fi

          echo "🚀 Building Docker Image and starting container..."
          # Using "docker compose" instead of the deprecated "docker-compose"
          sudo docker compose up --build -d

      - name: 📦 Run Prisma Migrations
        run: |
          echo "⏳ Waiting for DB to be accessible..."
          sleep 5
          echo "🔧 Running Prisma Migrations in Docker..."
          # Run prisma db push using the Next.js container environment
          if ! sudo docker compose exec -T web npx prisma db push --accept-data-loss; then
            echo "❌ Container failed to execute command. Dumping docker logs:"
            sudo docker compose logs web
            exit 1
          fi
          
      - name: 🩺 Health Check
        run: |
          echo "🩺 Checking application health at http://127.0.0.1:3000/api/health"
          MAX_RETRIES=15
          COUNT=0
          while [ $COUNT -lt $MAX_RETRIES ]; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L http://127.0.0.1:3000/api/health || echo "000")
            
            if [ "$STATUS_CODE" = "200" ]; then
              echo "✅ Application is healthy! (Status 200)"
              exit 0
            fi
            
            echo "⏳ Waiting for application to boot... (Status: $STATUS_CODE) ($((COUNT+1))/$MAX_RETRIES)"
            sleep 5
            COUNT=$((COUNT+1))
          done
          
          echo "⚠️ Health check timeout. Dumping Docker logs:"
          sudo docker compose logs --tail=50
          exit 1

      - name: 📣 Notify on Success
        if: success()
        run: |
          echo "🎉 QAPRIL Docker Deployment successful to production"
          echo "URL: ${{ vars.NEXT_PUBLIC_APP_URL }}"

      - name: 🧹 Fix permissions for next run
        if: always()
        run: |
          echo "🛡️ Restoring ownership for the next run..."
          sudo chown -R $USER:$USER ${{ github.workspace }} /home/github/actions-runner/_work || true
